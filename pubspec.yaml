name: morningfit
description: Offline-first walking and home fitness tracker.
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.25.1
  drift_flutter: ^0.2.4
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  pedometer: ^4.0.2
  flutter_local_notifications: ^18.0.1
  table_calendar: ^3.2.0
  fl_chart: ^0.70.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.25.2
  build_runner: ^2.4.15
  mocktail: ^1.0.4
flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
